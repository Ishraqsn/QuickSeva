spring.application.name=quickseva-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/quickseva;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
quickseva.demo.otp=${DEMO_OTP:123456}
quickseva.demo.token-secret=${DEMO_TOKEN_SECRET:quickseva-local-demo-secret-change-this-before-any-deployment}
quickseva.demo.token-hours=${DEMO_TOKEN_HOURS:12}
quickseva.demo.worker-phone=${DEMO_WORKER_PHONE:5550000001}
quickseva.demo.user-phone=${DEMO_USER_PHONE:5551234567}
